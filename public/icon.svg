<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Tallio">
  <!-- Full-bleed background keeps the icon maskable-safe; the mark stays in the inner safe zone. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1712"/>
      <stop offset="1" stop-color="#100e0b"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c669"/>
      <stop offset="1" stop-color="#c9962f"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Tally of five: four uprights + a diagonal — a nod to "Tallio". -->
  <g stroke="url(#gold)" stroke-width="26" stroke-linecap="round" fill="none">
    <line x1="184" y1="184" x2="184" y2="328"/>
    <line x1="232" y1="184" x2="232" y2="328"/>
    <line x1="280" y1="184" x2="280" y2="328"/>
    <line x1="328" y1="184" x2="328" y2="328"/>
    <line x1="168" y1="330" x2="344" y2="182"/>
  </g>
</svg>
